<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SAIM AI AGENT — Admin Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'], mono: ['JetBrains Mono','ui-monospace','monospace'] },
    colors: { ink: { 950:'#07070d', 900:'#0b0b14', 850:'#0e0e1a', 800:'#121222', 700:'#19192e' } }
  } } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; background: #07070d; color: #e7e7f0; font-family: Inter, system-ui, sans-serif; }
  .glass { background: rgba(18,18,32,.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.07); }
  .inp { width: 100%; padding: .65rem .85rem; border-radius: .75rem; background: #121222; border: 1px solid rgba(255,255,255,.1); color: #e4e4e7; font-size: 13px; outline: none; }
  .inp:focus { border-color: #a855f7; }
  .pbtn { width: 100%; padding: .75rem; border-radius: .75rem; font-size: 13px; font-weight: 600; background: linear-gradient(90deg,#9333ea,#22d3ee); color: #fff; cursor: pointer; border: none; transition: filter .15s; }
  .pbtn:hover { filter: brightness(1.1); }
  .grad-text { background: linear-gradient(110deg,#a855f7,#22d3ee 40%,#ec4899 75%,#a855f7); background-size: 220% auto; -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body class="min-h-screen grid place-items-center p-4 antialiased">

  <div class="w-full max-w-xl glass rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-2xl glass grid place-items-center text-purple-400 font-bold">SA</div>
      <div>
        <h1 class="font-extrabold text-lg text-white">SAIM Studio <span class="grad-text">Admin Panel</span></h1>
        <p class="text-xs text-zinc-400">Direct Dual-Sync to Realtime DB & Firestore</p>
      </div>
    </div>

    <!-- Status Message Box -->
    <div id="adminToast" class="mb-4 p-3 rounded-xl bg-ink-900 border border-white/5 text-center text-xs font-medium text-cyan-400">
      Ready to save keys.
    </div>

    <!-- Admin Form -->
    <form id="adminForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-zinc-300 mb-1">Google Gemini API Key</label>
        <input type="password" id="adminGemini" class="inp font-mono" placeholder="AIzaSy..." />
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 mb-1">OpenAI (ChatGPT) API Key</label>
        <input type="password" id="adminOpenai" class="inp font-mono" placeholder="sk-proj-..." />
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 mb-1">DeepSeek API Key</label>
        <input type="password" id="adminDeepseek" class="inp font-mono" placeholder="sk-..." />
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 mb-1">Anthropic Claude API Key</label>
        <input type="password" id="adminAnthropic" class="inp font-mono" placeholder="sk-ant-..." />
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 mb-1">Default Gemini Model</label>
        <input type="text" id="adminModel" class="inp font-mono" value="gemini-flash-latest" />
      </div>

      <button type="submit" id="saveBtn" class="pbtn mt-2">Save Keys Now</button>
    </form>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyA2tXddGxNdcooTlg9JsYNUwzpxxnobE0A",
      authDomain: "saimaiagent.firebaseapp.com",
      databaseURL: "https://saimaiagent-default-rtdb.firebaseio.com",
      projectId: "saimaiagent",
      storageBucket: "saimaiagent.firebasestorage.app",
      messagingSenderId: "1063618307954",
      appId: "1:1063618307954:web:5ff9a4983ed1d1f18e9feb"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    const rtdb = firebase.database();
    const fsdb = firebase.firestore();

    const toastEl = document.getElementById('adminToast');
    function showToast(msg, isErr) {
      toastEl.textContent = msg;
      toastEl.className = `mb-4 p-3 rounded-xl bg-ink-900 text-center text-xs font-medium border ${isErr ? 'text-red-400 border-red-500/30' : 'text-emerald-400 border-emerald-500/30'}`;
    }

    // পেজ লোড হওয়ার সাথে সাথে আগের সেভ করা কি-গুলো অটো নিয়ে আসবে
    window.addEventListener('DOMContentLoaded', () => {
      rtdb.ref('config/system_keys').once('value').then(snap => {
        const data = snap.val() || {};
        document.getElementById('adminGemini').value = data.gemini || '';
        document.getElementById('adminOpenai').value = data.openai || '';
        document.getElementById('adminDeepseek').value = data.deepseek || '';
        document.getElementById('adminAnthropic').value = data.anthropic || '';
        if (data.geminiModel) document.getElementById('adminModel').value = data.geminiModel;
      }).catch(err => console.log(err));
    });

    // সেভ করার বাটন হ্যান্ডলার
    document.getElementById('adminForm').onsubmit = async (e) => {
      e.preventDefault();
      showToast('Saving data to Firebase...', false);

      const payload = {
        gemini: document.getElementById('adminGemini').value.trim(),
        openai: document.getElementById('adminOpenai').value.trim(),
        deepseek: document.getElementById('adminDeepseek').value.trim(),
        anthropic: document.getElementById('adminAnthropic').value.trim(),
        geminiModel: document.getElementById('adminModel').value.trim() || 'gemini-flash-latest'
      };

      try {
        // ১. রিয়েলটাইম ডেটাবেসে সেভ
        await rtdb.ref('config/system_keys').set(payload);

        // ২. ফায়ারস্টোরে সেভ
        await fsdb.collection('config').doc('system_keys').set(payload, { merge: true });

        showToast('✅ Successfully saved to BOTH Databases!', false);
      } catch (err) {
        console.error(err);
        showToast('❌ Error: ' + err.message, true);
      }
    };
  </script>
</body>
</html>
