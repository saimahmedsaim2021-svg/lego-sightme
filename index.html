<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Lego Sight</title>
    <!-- আধুনিক ইংলিশ ফন্ট (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* প্রিমিয়াম ডার্ক মেটাল গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড */
            background: radial-gradient(circle at center, #1e293b, #090d16);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        /* আধুনিক গ্লোইং বাটন */
        .lego-btn {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 600;
            padding: 18px 45px;
            border-radius: 50px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: capitalize;
        }

        /* মাউস নিলে সুন্দর হোভার এনিমেশন */
        .lego-btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 18px 40px rgba(236, 72, 153, 0.55);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .lego-btn:active {
            transform: translateY(2px) scale(0.98);
        }

        /* মোবাইল স্ক্রিনের জন্য নিখুঁত মাপ */
        @media (max-width: 600px) {
            .lego-btn {
                font-size: 1.15rem;
                padding: 16px 36px;
                width: 80vw;
                max-width: 270px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Lego Sight বাটন -->
        <a href="https://lego-sight.vercel.app/" class="lego-btn">
            Lego Sight
        </a>
    </div>

</body>
</html>
